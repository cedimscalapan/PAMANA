<ion-content [fullscreen]="true"><main class="onboarding"><button class="skip" (click)="skip()">Skip</button><div class="brand"><span class="brand-mark">☼</span><div><strong>SMART</strong><b>PAMANA</b></div></div><section class="hero"><div class="sun"></div><div class="mascot" aria-label="Ka-Pamana guide">☺</div><div class="mountains">⌁⌁⌁</div></section><div class="copy"><div class="step-icon">{{ slides[step].icon }}</div><p class="eyebrow">{{ step + 1 }} / {{ slides.length }} · YOUR CULTURAL LEARNING GUIDE</p><h1>{{ slides[step].title }}</h1><p>{{ slides[step].text }}</p></div><div class="dots"><i *ngFor="let slide of slides; let i = index" [class.active]="i === step"></i></div><ion-button expand="block" class="primary" (click)="next()">{{ step === slides.length - 1 ? 'Get started' : 'Continue' }} <span>→</span></ion-button></main></ion-content>
