<ion-content><main class="module-page"><header><button class="back" (click)="back()">‹</button><h1>Matuto</h1></header><p class="lead">Learn about Oriental Mindoro through short, offline lessons.</p><div class="toolbar"><button class="filter active">All</button><button class="filter">History</button><button class="filter">Communities</button><button class="filter">Arts</button></div><article class="list-card" *ngFor="let lesson of content.lessons()"><span class="meta">{{lesson.category}} · {{lesson.duration}} min</span><h2>{{lesson.title}}</h2><p>{{lesson.summary}}</p><button class="action" (click)="open(lesson.id)">{{lesson.completed ? 'Completed' : 'Mark complete'}}</button></article></main></ion-content>
