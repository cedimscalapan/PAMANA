<ion-content><main class="module-page"><header><button class="back" (click)="back()">‹</button><h1>Koleksyon</h1></header><p class="lead">A local gallery for documented heritage items and approved imagery.</p><div class="grid"><article class="list-card" *ngFor="let item of items"><button class="card-button" (click)="open(item)"><div class="canvas" style="height:100px;margin:0 0 10px;font-size:32px">✦</div><h2>{{item}}</h2><span class="meta">{{isCollected(item) ? 'SAVED LOCALLY' : 'CONTENT REVIEW REQUIRED'}}</span></button><button class="action" (click)="collect(item)">{{isCollected(item) ? 'Collected' : 'Collect'}}</button></article></div><article class="list-card" *ngIf="selected"><span class="meta">COLLECTION ITEM</span><h2>{{selected}}</h2><p>This entry is ready for approved images, provenance, creator credit, and community permissions.</p><button class="action" (click)="collect(selected)">{{isCollected(selected) ? 'Collected locally' : 'Collect item'}}</button></article></main></ion-content>
