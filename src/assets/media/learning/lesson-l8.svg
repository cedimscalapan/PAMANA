<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img"><title>Knowledge carried between generations.</title><desc>A typographic learning card about Ginaw Bilog’s 1993 recognition. This is not his portrait or an award emblem.</desc><style>text{font-family:Arial,sans-serif;fill:#1d4943} .muted{fill:#536e67}</style><rect width="800" height="480" rx="22" fill="#f2f0e5"/><circle cx="730" cy="30" r="150" fill="#dce8d8"/><text x="42" y="40" font-size="12" letter-spacing="2">SMART PAMANA / LEARNING ILLUSTRATION</text><text x="42" y="95" font-size="29" font-family="Georgia,serif">Knowledge carried between</text><text x="42" y="129" font-size="29" font-family="Georgia,serif">generations.</text><text x="42" y="245" font-size="100" >1993</text><text x="350" y="215" font-size="28" >National Living Treasure</text><text x="350" y="257" font-size="21" >Poetry · writing · teaching</text><text x="42" y="358" font-size="24" >Bamboo records and notebooks</text><text x="42" y="440" font-size="15" class="muted">Ginaw Bilog · Hanunuo Mangyan poet</text><text x="42" y="464" font-size="11" class="muted">Original diagram · educational reference</text></svg>