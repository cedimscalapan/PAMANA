<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img"><title>Many communities. Distinct voices.</title><desc>Eight names from the Library of Congress guide, displayed equally without portraits, costumes or an inferred map of communities.</desc><style>text{font-family:Arial,sans-serif;fill:#1d4943} .muted{fill:#536e67}</style><rect width="800" height="480" rx="22" fill="#f2f0e5"/><circle cx="730" cy="30" r="150" fill="#dce8d8"/><text x="42" y="40" font-size="12" letter-spacing="2">SMART PAMANA / LEARNING ILLUSTRATION</text><text x="42" y="95" font-size="29" font-family="Georgia,serif">Many communities. Distinct voices.</text><rect x="42" y="165" width="330" height="46" rx="12" fill="#e1e7d9"/><text x="62" y="195" font-size="22" >Iraya</text><rect x="402" y="165" width="330" height="46" rx="12" fill="#e1e7d9"/><text x="422" y="195" font-size="22" >Alangan</text><rect x="42" y="225" width="330" height="46" rx="12" fill="#e1e7d9"/><text x="62" y="255" font-size="22" >Tadyawan</text><rect x="402" y="225" width="330" height="46" rx="12" fill="#e1e7d9"/><text x="422" y="255" font-size="22" >Tawbuid</text><rect x="42" y="285" width="330" height="46" rx="12" fill="#e1e7d9"/><text x="62" y="315" font-size="22" >Bangon</text><rect x="402" y="285" width="330" height="46" rx="12" fill="#e1e7d9"/><text x="422" y="315" font-size="22" >Buhid</text><rect x="42" y="345" width="330" height="46" rx="12" fill="#e1e7d9"/><text x="62" y="375" font-size="22" >Hanunuo</text><rect x="402" y="345" width="330" height="46" rx="12" fill="#e1e7d9"/><text x="422" y="375" font-size="22" >Ratagnon</text><text x="42" y="440" font-size="15" class="muted">Names in the Library of Congress guide</text><text x="42" y="464" font-size="11" class="muted">Original diagram · educational reference</text></svg>