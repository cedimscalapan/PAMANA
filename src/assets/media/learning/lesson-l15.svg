<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img"><title>Start with the named institution.</title><desc>A text guide distinguishes the museum in Calapan from the heritage and cultural center in Mansalay. No building likeness is invented.</desc><style>text{font-family:Arial,sans-serif;fill:#1d4943} .muted{fill:#536e67}</style><rect width="800" height="480" rx="22" fill="#f2f0e5"/><circle cx="730" cy="30" r="150" fill="#dce8d8"/><text x="42" y="40" font-size="12" letter-spacing="2">SMART PAMANA / LEARNING ILLUSTRATION</text><text x="42" y="95" font-size="29" font-family="Georgia,serif">Start with the named institution.</text><text x="42" y="211" font-size="29" >Calapan City</text><text x="42" y="250" font-size="23" >Oriental Mindoro Heritage Museum</text><text x="42" y="319" font-size="29" >Mansalay</text><text x="42" y="358" font-size="23" >Heritage &amp; Cultural Center</text><text x="42" y="440" font-size="15" class="muted">Place references · verify current access</text><text x="42" y="464" font-size="11" class="muted">Original diagram · educational reference</text></svg>