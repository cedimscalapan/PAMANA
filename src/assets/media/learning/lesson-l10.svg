<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img"><title>Keep the record with the object.</title><desc>Three labeled panels connect an object, transliteration and translation. Named contributors remain part of the historical record.</desc><style>text{font-family:Arial,sans-serif;fill:#1d4943} .muted{fill:#536e67}</style><rect width="800" height="480" rx="22" fill="#f2f0e5"/><circle cx="730" cy="30" r="150" fill="#dce8d8"/><text x="42" y="40" font-size="12" letter-spacing="2">SMART PAMANA / LEARNING ILLUSTRATION</text><text x="42" y="95" font-size="29" font-family="Georgia,serif">Keep the record with the object.</text><rect x="42" y="188" width="220" height="120" rx="18" fill="#d9e5d7"/><text x="60" y="252" font-size="22" >Object</text><rect x="292" y="188" width="220" height="120" rx="18" fill="#d9e5d7"/><text x="310" y="252" font-size="22" >Transliteration</text><rect x="542" y="188" width="220" height="120" rx="18" fill="#d9e5d7"/><text x="560" y="252" font-size="22" >Translation</text><text x="42" y="370" font-size="23" >Luyon · Kabal · Balik · Maliwanag brothers</text><text x="42" y="440" font-size="15" class="muted">Provenance · documentation · interpretation</text><text x="42" y="464" font-size="11" class="muted">Original diagram · educational reference</text></svg>