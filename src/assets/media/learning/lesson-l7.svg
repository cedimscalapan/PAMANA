<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img"><title>Seven syllables. A world of meaning.</title><desc>Seven numbered circles illustrate the seven-syllable line. No poem, cultural motif or performance is reproduced.</desc><style>text{font-family:Arial,sans-serif;fill:#1d4943} .muted{fill:#536e67}</style><rect width="800" height="480" rx="22" fill="#f2f0e5"/><circle cx="730" cy="30" r="150" fill="#dce8d8"/><text x="42" y="40" font-size="12" letter-spacing="2">SMART PAMANA / LEARNING ILLUSTRATION</text><text x="42" y="95" font-size="29" font-family="Georgia,serif">Seven syllables. A world of meaning.</text><circle cx="85" cy="235" r="34" fill="#8eac8b"/><text x="78" y="243" font-size="22" >1</text><circle cx="189" cy="235" r="34" fill="#d0b47e"/><text x="182" y="243" font-size="22" >2</text><circle cx="293" cy="235" r="34" fill="#8eac8b"/><text x="286" y="243" font-size="22" >3</text><circle cx="397" cy="235" r="34" fill="#d0b47e"/><text x="390" y="243" font-size="22" >4</text><circle cx="501" cy="235" r="34" fill="#8eac8b"/><text x="494" y="243" font-size="22" >5</text><circle cx="605" cy="235" r="34" fill="#d0b47e"/><text x="598" y="243" font-size="22" >6</text><circle cx="709" cy="235" r="34" fill="#8eac8b"/><text x="702" y="243" font-size="22" >7</text><text x="42" y="340" font-size="24" >Metaphor · advice · welcome · farewell</text><text x="42" y="382" font-size="17" >A meter diagram, without reproducing a poem.</text><text x="42" y="440" font-size="15" class="muted">Ambahan · Hanunuo Mangyan poetry</text><text x="42" y="464" font-size="11" class="muted">Original diagram · educational reference</text></svg>