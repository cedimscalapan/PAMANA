<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img"><title>Bamboo in two documented formats.</title><desc>Schematic examples of bamboo formats, labeled 71 slats and six cylinders. Shapes are illustrative, not one icon per item and not copies of manuscripts.</desc><style>text{font-family:Arial,sans-serif;fill:#1d4943} .muted{fill:#536e67}</style><rect width="800" height="480" rx="22" fill="#f2f0e5"/><circle cx="730" cy="30" r="150" fill="#dce8d8"/><text x="42" y="40" font-size="12" letter-spacing="2">SMART PAMANA / LEARNING ILLUSTRATION</text><text x="42" y="95" font-size="29" font-family="Georgia,serif">Bamboo in two documented formats.</text><rect x="60" y="175" width="24" height="155" rx="8" fill="#b9aa77"/><rect x="98" y="175" width="24" height="155" rx="8" fill="#b9aa77"/><rect x="136" y="175" width="24" height="155" rx="8" fill="#b9aa77"/><rect x="174" y="175" width="24" height="155" rx="8" fill="#b9aa77"/><rect x="212" y="175" width="24" height="155" rx="8" fill="#b9aa77"/><rect x="250" y="175" width="24" height="155" rx="8" fill="#b9aa77"/><rect x="288" y="175" width="24" height="155" rx="8" fill="#b9aa77"/><rect x="455" y="175" width="54" height="155" rx="24" fill="#89a086"/><rect x="537" y="175" width="54" height="155" rx="24" fill="#89a086"/><rect x="619" y="175" width="54" height="155" rx="24" fill="#89a086"/><text x="54" y="376" font-size="27" >71 slats</text><text x="450" y="376" font-size="27" >6 cylinders</text><text x="42" y="440" font-size="15" class="muted">Library of Congress · collection circa 1900–1939</text><text x="42" y="464" font-size="11" class="muted">Original diagram · educational reference</text></svg>