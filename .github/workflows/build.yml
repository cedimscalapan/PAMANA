name: Build SMART PAMANA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        # Use npm install so CI can reconcile a lockfile produced by a different npm minor.
        run: npm install --no-audit --no-fund
      - name: Build production app
        run: npm run build
      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: smart-pamana-web-build
          path: dist/smart-pamana
